# Exact export (conda env export --no-builds) of the qcflow env that ran the FSI/PF6 campaign on
# NERSC Perlmutter (A100, CUDA 12 wheels) on 2026-10-04. The two editable packages that live in
# this repo's dependency chain (gpu4pyscf-campaign itself, lewis-geometry-solver) and the
# qcflow-gpu4pyscf checkout are installed by setup_env.sh, not from this file.
# The nvidia-*-cu12 / cutensor-cu12 wheels are listed here as they were on Perlmutter; on a
# machine with a different driver/CUDA you may have to adjust them (see README, Environment).
